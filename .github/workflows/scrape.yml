name: Job Scraper

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC every day (4x/day)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # allow manual runs from GitHub UI

permissions:
  contents: write # needed to commit seen_jobs.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a PAT so the commit-back step can trigger further workflows if needed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python scraper.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update seen_jobs [skip ci]"
          git push
